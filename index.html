<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Death Announcement Card</title>

<style>
body {
    margin: 0;
    padding: 20px;
    background: #f0f0f0;
    font-family: Arial, sans-serif;
    display: flex;
    gap: 20px;
}

/* FORM */
.form-box {
    width: 280px;
    background: #fff;
    padding: 20px;
    border-radius: 10px;
}

.form-box h3 {
    margin-top: 0;
    margin-bottom: 10px;
}

.form-box input {
    width: 100%;
    margin-bottom: 14px;   
    padding: 8px;
    font-size: 14px;
    font-weight: normal;   
    box-sizing: border-box;
}
.form-box input::placeholder {
    font-weight: normal;
    color: #666;
}
.form-box button {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    background: #000;
    color: #fff;
    border: none;
    cursor: pointer;
    font-size: 14px;
}

/* CARD */
#card {
    width: 1013px;
    height: 638px;
    background: #fff;
    border: 2px solid #000;
    box-sizing: border-box;

    display: flex;
    flex-direction: column;
}

/* HEADER */
.header {
    background: #0b5f14;
    color: #fff;
    text-align: center;
    font-size: 34px;
    font-weight: bold;
    padding: 14px;
}

/* MAIN HEADER */
.mainheader {
    font-size: 28px;
    font-style: italic;
    text-align: center;
    margin: 15px 0;
}

/* BODY */
.body {
    display: flex;
    padding: 30px 40px;
    flex: 1;
}

/* PHOTO */
.photo-box {
    border: 4px solid #0b5f14;
    width: 220px;
    height: 260px;
    box-sizing: border-box;
}

.photo-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* TEXT */
.text {
    margin-left: 40px;
    font-size: 26px;
}

.text h1 {
    font-size: 26px;
    margin: 0 0 18px;
}

.text p {
    margin: 10px 0;
}

/* FOOTER */
.footer {
    text-align: center;
    font-size: 22px;
    font-style: italic;
    padding-bottom: 20px;
    margin-top: auto;
}
</style>
</head>

<body>

<!-- FORM -->
<div class="form-box">
    <h3>Enter Details</h3>

    <input type="file" id="imgInput" accept="image/*">
    <input type="text" id="name" placeholder="Name">
    <input type="text" id="fname" placeholder="Father Name">
    <input type="date" id="expiredOn">
    <input type="text" id="age" placeholder="Age">
    <input type="text" id="address" placeholder="Hometown">
    <input type="date" id="burialDate">
    <input type="time" id="time">
    <input type="text" id="funeral" placeholder="Venue">

    <button onclick="generateCard()">Generate Card</button>
    <button onclick="downloadCard()">Download Image</button>
</div>

<!-- CARD -->
<div id="card">
    <div class="header">Mayyat Announcement</div>

    <div class="mainheader">
        إِنَّا لِلَّٰهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ
    </div>

    <div class="body">
        <div class="photo-box">
            <img id="photo">
        </div>

        <div class="text">
            <h1 id="cName">Name:</h1>
            <h1 id="fName">Father Name:</h1>
            <p><b>Expired On:</b> <span id="cExpired"></span></p>
            <p><b>Age:</b> <span id="cAge"></span></p>
            <p><b>Hometown:</b> <span id="cAddress"></span></p>
            <p><b>Burial Date:</b> <span id="cBurial"></span></p>
            <p><b>Namaz Janaza Time:</b> <span id="cTime"></span></p>
            <p><b>Venue:</b> <span id="cFuneral"></span></p>
        </div>
    </div>

    <div class="footer">
        Karimabad JamatKhana Mayyat Committee
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
// Convert time to 12-hour format with AM/PM
function formatTime12Hour(time) {
    if (!time) return "";
    let [hour, minute] = time.split(":");
    hour = parseInt(hour);

    const ampm = hour >= 12 ? "PM" : "AM";
    hour = hour % 12 || 12;

    return `${hour}:${minute} ${ampm}`;
}
    function formatDateDMY(dateStr) {
    if (!dateStr) return "";

    const date = new Date(dateStr);

    const day = date.getDate().toString().padStart(2, "0");
    const monthNames = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
    ];
    const month = monthNames[date.getMonth()];
    const year = date.getFullYear();

    return `${day} ${month} ${year}`;
}


// Generate card
function generateCard() {
    document.getElementById('cName').innerText =
        "Name: " + document.getElementById('name').value;

    document.getElementById('fName').innerText =
        "Father Name: " + document.getElementById('fname').value;

document.getElementById('cExpired').innerText =
    formatDateDMY(document.getElementById('expiredOn').value);

    document.getElementById('cAge').innerText =
        document.getElementById('age').value;

    document.getElementById('cAddress').innerText =
        document.getElementById('address').value;

document.getElementById('cBurial').innerText =
    formatDateDMY(document.getElementById('burialDate').value);

    const timeValue = document.getElementById('time').value;
    document.getElementById('cTime').innerText =
        formatTime12Hour(timeValue);

    document.getElementById('cFuneral').innerText =
        document.getElementById('funeral').value;
}

// Image preview
document.getElementById('imgInput').onchange = e => {
    const reader = new FileReader();
    reader.onload = () => document.getElementById('photo').src = reader.result;
    reader.readAsDataURL(e.target.files[0]);
};

// Download card
function downloadCard() {
    html2canvas(document.getElementById('card'), { scale: 2 }).then(canvas => {
        const a = document.createElement("a");
        a.download = "death-announcement-card.png";
        a.href = canvas.toDataURL("image/png");
        a.click();
    });
}
</script>

</body>
</html>
